services:
  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"  # host access for ./setup.sh dev and SQL clients
    environment:
      POSTGRES_DB: refunds
      POSTGRES_USER: refunds
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-refunds}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refunds"]
      interval: 2s
      retries: 30

  provider:
    build: ./backend
    command: ["uvicorn", "mock_provider.main:app", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      PROVIDER_API_KEY: ${PROVIDER_API_KEY:-demo-provider-key}
    ports:
      - "9000:9000"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      provider:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-}  # set to use any external Postgres; otherwise built (URL-quoted) from DB_*
      DB_HOST: db
      DB_USER: refunds
      DB_PASSWORD: ${POSTGRES_PASSWORD:-refunds}
      DB_SSLMODE: disable  # private Compose network
      JWT_SECRET: ${JWT_SECRET:-}  # blank => random per start
      HISTORY_PROVIDER_URL: http://provider:9000
      HISTORY_PROVIDER_API_KEY: ${PROVIDER_API_KEY:-demo-provider-key}
      ALLOWED_REDIRECT_ORIGINS: http://localhost:8080,http://localhost:5173
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      TRUSTED_PROXY_HOPS: "1"  # nginx
      DEVIN_API_KEY: ${DEVIN_API_KEY:-}  # blank => self-healing loop records tickets but doesn't call Devin
      DEVIN_ORG_ID: ${DEVIN_ORG_ID:-}
      DEVIN_BASE_BRANCH: ${DEVIN_BASE_BRANCH:-main}
      DEVIN_MAX_ACU: ${DEVIN_MAX_ACU:-10}
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
