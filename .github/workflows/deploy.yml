name: Deploy

# Production deploys are manual only: run this workflow from the Actions tab (or `gh workflow run`).
# It still runs the full CI suite first; only if it passes does it build, migrate infra and roll out.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    if: vars.AWS_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: prod
      github_environment: production
    secrets: inherit
