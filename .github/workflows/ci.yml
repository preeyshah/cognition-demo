name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: refunds
          POSTGRES_PASSWORD: refunds
          POSTGRES_DB: refunds
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U refunds" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests mock_provider
      - name: Unit tests (pytest)
        run: pytest -q
      - name: Postgres smoke test (schema, BI views, audit trigger, seed)
        env:
          DATABASE_URL: postgresql+psycopg://refunds:refunds@localhost:5432/refunds
        run: PYTHONPATH=. python scripts/pg_smoke.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Type-check + build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t refunds-backend backend
      - run: docker build -t refunds-frontend frontend

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
