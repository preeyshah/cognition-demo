name: Deploy env

# Reusable deploy for one Terraform environment root (infra/dev or infra/prod).
# Called by deploy.yml (main -> prod) and dev.yml (dev -> dev). Requires repo
# secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY and vars TF_STATE_BUCKET,
# AWS_REGION, DEVIN_ORG_ID (see README "AWS infrastructure").
on:
  workflow_call:
    inputs:
      environment:
        description: "Terraform root directory under infra/ (dev or prod)"
        required: true
        type: string
      github_environment:
        description: "GitHub Environment for deployment protection rules"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_image_tag: ${{ github.sha }}
      TF_VAR_devin_org_id: ${{ vars.DEVIN_ORG_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform init
        working-directory: infra/${{ inputs.environment }}
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=$AWS_REGION"
      - name: Create ECR repo on first deploy
        working-directory: infra/${{ inputs.environment }}
        run: terraform apply -input=false -auto-approve -lock-timeout=10m -target=module.app.aws_ecr_repository.backend
      - name: Build + push backend image
        run: |
          REPO=$(terraform -chdir=infra/${{ inputs.environment }} output -raw ecr_repository_url)
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPO%%/*}"
          docker build -t "$REPO:$GITHUB_SHA" backend
          docker push "$REPO:$GITHUB_SHA"
      - name: Terraform apply (infra + new task definitions)
        working-directory: infra/${{ inputs.environment }}
        run: terraform apply -input=false -auto-approve -lock-timeout=10m
      - name: Wait for ECS rollout
        run: aws ecs wait services-stable --cluster "$(terraform -chdir=infra/${{ inputs.environment }} output -raw ecs_cluster)" --services api provider
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build + publish frontend
        working-directory: frontend
        run: |
          npm ci && npm run build
          aws s3 sync dist "s3://$(terraform -chdir=../infra/${{ inputs.environment }} output -raw frontend_bucket)" --delete
          aws cloudfront create-invalidation --distribution-id "$(terraform -chdir=../infra/${{ inputs.environment }} output -raw cloudfront_distribution_id)" --paths '/*'
      - name: Smoke test
        run: |
          URL=$(terraform -chdir=infra/${{ inputs.environment }} output -raw app_url)
          curl -fsS "$URL/api/health" -D - | grep -i x-trace-id
          echo "Deployed $GITHUB_SHA to $URL" >> "$GITHUB_STEP_SUMMARY"
